<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Register | Example Airline Careers</title>
<!--
  Built like the Avature register page where Fill.ai went wrong: real Select2
  boxes over hidden <select>s (one already set by the site), a city list that
  only loads once a country is chosen, and a date of birth behind a
  jQuery Mask that keeps a 2-digit year.
-->
<link rel="stylesheet" href="/vendor/select2.css">
<script src="/vendor/jquery.js"></script>
<script src="/vendor/select2.js"></script>
<script src="/vendor/jquery.mask.js"></script>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; background: #fff; color: #222; margin: 0; }
  form { max-width: 600px; margin: 30px auto 200px; }
  .fieldSpec { margin-bottom: 18px; }
  label { display: block; font-weight: 500; margin-bottom: 4px; }
  .hint { font-size: 13px; color: #555; margin: -2px 0 4px; }
  .req { color: #b00; }
  input[type=text], input[type=email], select { width: 100%; box-sizing: border-box; padding: 9px 10px; border: 1px solid #ccc; border-radius: 4px; font: inherit; }
</style>
</head>
<body>
<form id="reg" onsubmit="window.__submits = (window.__submits || 0) + 1; return false;">
  <div class="fieldSpec"><label for="title">Title <span class="req">*</span></label>
    <select id="title" name="title"><option value="">Select an option</option><option>Mr.</option><option>Mrs.</option><option>Ms.</option><option>Miss</option><option>Dr.</option></select></div>
  <div class="fieldSpec"><label for="first">First name <span class="req">*</span></label><div class="hint">as in Passport</div><input type="text" id="first" name="first"></div>
  <div class="fieldSpec"><label for="preferred">Preferred first name</label><input type="text" id="preferred" name="preferred"></div>
  <div class="fieldSpec"><label for="last">Last name <span class="req">*</span></label><div class="hint">as in Passport</div><input type="text" id="last" name="last"></div>
  <div class="fieldSpec"><label for="email">Email address <span class="req">*</span></label><input type="email" id="email" name="email" value="asha.verma@example.com"></div>
  <div class="fieldSpec"><label for="alt">Do you want to provide an alternate phone number? <span class="req">*</span></label>
    <select id="alt" name="alt" class="s2"><option></option><option>Yes</option><option>No</option></select></div>
  <div class="fieldSpec"><label for="li">LinkedIn profile url (Optional)</label><input type="text" id="li" name="linkedin"></div>
  <div class="fieldSpec"><label for="base">Preferred work location</label>
    <select id="base" name="base"><option></option><option>Dubai</option><option>Abu Dhabi</option></select></div>
  <div class="fieldSpec"><label for="country">Country of Residence <span class="req">*</span></label>
    <select id="country" name="country"><option></option><option>India</option><option>United Arab Emirates</option><option>United Kingdom</option></select></div>
  <div class="fieldSpec"><label for="city">City of Residence <span class="req">*</span></label>
    <select id="city" name="city"><option></option></select></div>
  <div class="fieldSpec"><label for="airport">Nearest airport</label>
    <select id="airport" name="airport"><option></option></select></div>
  <div class="fieldSpec"><label for="dob">Date of Birth <span class="req">*</span></label><input type="text" id="dob" name="dob"></div>
  <div class="fieldSpec"><label for="nat">Nationality <span class="req">*</span></label><div class="hint">If you hold multiple citizenships, please list all.</div>
    <select id="nat" name="nat" multiple><option>British</option><option>Emirati</option><option>Indian</option><option>Nepali</option></select></div>
  <div class="fieldSpec"><label><input type="checkbox" id="terms"> I agree to the Terms &amp; Conditions</label></div>
  <button type="submit">Save &amp; continue</button>
</form>
<script>
  const CITIES = { India: ['Mumbai', 'Pune', 'Delhi'], 'United Arab Emirates': ['Dubai', 'Abu Dhabi'], 'United Kingdom': ['London', 'Leeds'] };
  $('#alt').select2({ placeholder: 'Select an option', minimumResultsForSearch: Infinity });
  $('#country').select2({ placeholder: 'Select an option', allowClear: true });
  $('#city').select2({ placeholder: 'Select an option', allowClear: true });
  $('#base').select2({ placeholder: 'Select an option', allowClear: true });
  $('#nat').select2({ placeholder: 'Select an option' });
  // The site sets this one itself, the way Avature pre-fills from a resume.
  $('#base').val('Dubai').trigger('change');
  // The city list arrives only once a country is picked.
  $('#country').on('change', function () {
    const city = $('#city');
    city.empty().append(new Option('', ''));
    for (const c of CITIES[this.value] || []) city.append(new Option(c, c));
    city.val('').trigger('change');
  });
  $('#dob').mask('00/00/00');
  // A list that only exists once you type: Select2's search-as-you-type
  // (the way many sites load cities and schools from their server).
  const AIRPORTS = ['Mumbai (BOM)', 'Pune (PNQ)', 'Delhi (DEL)', 'Dubai (DXB)'];
  $('#airport').select2({
    placeholder: 'Start typing',
    minimumInputLength: 2,
    ajax: {
      delay: 50,
      transport: (params, success) => {
        const term = (params.data.term || '').toLowerCase();
        setTimeout(() => success({ results: AIRPORTS.filter((a) => a.toLowerCase().includes(term)).map((a) => ({ id: a, text: a })) }), 80);
        return { abort() {} };
      },
      processResults: (data) => data,
    },
  });
</script>
</body>
</html>
