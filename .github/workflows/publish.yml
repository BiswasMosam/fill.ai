# Every push to master: run the unit tests, build the extension, publish it
# as a GitHub Release (fill-ai.zip), and publish the download page to GitHub
# Pages, which serves it at www.mosambiswas.com/Fill.ai/.
#
# The page's Download button points at releases/latest/download/fill-ai.zip,
# so it always hands out the newest build. Bump "version" in
# static/manifest.json (and package.json) for a new release; pushes without
# a bump replace the zip in the current one.

name: Publish

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and move its tag
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run site

      - name: Publish the zip as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./static/manifest.json').version")
          TAG="v$VERSION"
          if gh release view "$TAG" > /dev/null 2>&1; then
            # Same version, newer build: move the tag here and replace the zip.
            git tag -f "$TAG"
            git push -f origin "refs/tags/$TAG"
            gh release upload "$TAG" release/fill-ai.zip --clobber
          else
            gh release create "$TAG" release/fill-ai.zip \
              --target "$GITHUB_SHA" --latest \
              --title "Fill.ai $VERSION" \
              --notes "Install steps: https://www.mosambiswas.com/Fill.ai/#install"
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
